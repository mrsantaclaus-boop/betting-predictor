# render.yaml — Deploy SAI Tipster to Render.com (free tier)
# Docs: https://render.com/docs/yaml-spec
#
# NOTE: the live service (https://betting-predictor-i9rt.onrender.com) was
# created from the dashboard, not from this Blueprint, so this file documents
# the intended configuration. Keep the env var list in sync with the dashboard.

services:
  - type: web
    name: betting-predictor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free

    # Health check — Render uses this to know when the app is ready
    healthCheckPath: /api/health

    envVars:
      # ── Admin / security ─────────────────────────────────────────────────────
      - key: ADMIN_TOKEN            # X-Admin-Token for predict/sync/backfill/delete/cache
        sync: false
      - key: ALLOWED_ORIGIN         # CORS; "*" keeps the old behaviour
        value: "*"

      # ── LLM (Groq, via MiroFish client) ─────────────────────────────────────
      - key: USE_LLM                # "true" = Poisson + LLM blend (6-week experiment from 2026-09-28)
        value: "true"
      - key: LLM_API_KEY
        sync: false                 # set manually in Render dashboard
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL_NAME
        value: openai/gpt-oss-120b   # llama-3.3-70b-versatile decommissioned by Groq 2026-08-16

      # ── Football data ───────────────────────────────────────────────────────
      - key: FOOTBALL_DATA_API_KEY
        sync: false

      # ── API-Football (optional; WCQ/BSA now come from ESPN) ─────────────────
      - key: API_FOOTBALL_KEY
        sync: false

      # ── Odds API ────────────────────────────────────────────────────────────
      - key: ODDS_API_KEY
        sync: false

      # ── News APIs ───────────────────────────────────────────────────────────
      - key: NEWS_API_KEY
        sync: false
      - key: GNEWS_API_KEY
        sync: false

      # ── Database (Supabase PostgreSQL; SQLite fallback when unset) ──────────
      - key: DATABASE_URL
        sync: false

      # ── App ──────────────────────────────────────────────────────────────────
      - key: PORT
        value: 8080
      - key: FLASK_ENV
        value: production
      - key: PRED_DB_PATH
        value: /app/data/predictions.db
      - key: LOCAL_ZEP_DB_PATH
        value: /app/data/local_memory.db
      - key: CACHE_DB_PATH
        value: /app/data/cache.db

      # MIROFISH_API_URL (http://localhost:5001) is no longer used: the
      # MiroFish client calls the LLM directly. Left out on purpose.

    # No persistent disk: the free plan does not support disks, and
    # predictions persist in Supabase via DATABASE_URL.
