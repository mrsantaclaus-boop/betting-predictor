name: Groq models check

# Manual utility: lists the models the production Groq key can use and
# tries one chat completion with the model given as input. Useful when Groq
# deprecates a model (LLM_MODEL_NAME on Render must be updated).
on:
  workflow_dispatch:
    inputs:
      model:
        description: "Judge model id to test"
        default: openai/gpt-oss-120b
      swarm:
        description: "Also run the MiroFish mini-swarm on a sample dossier"
        default: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - name: List models and test one
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MODEL: ${{ github.event.inputs.model }}
          SWARM: ${{ github.event.inputs.swarm }}
        run: |
          python - <<'EOF'
          import os, requests
          h = {"Authorization": f"Bearer {os.environ['GROQ_API_KEY']}"}
          r = requests.get("https://api.groq.com/openai/v1/models", headers=h, timeout=30)
          print("models status", r.status_code)
          if r.ok:
              for m in sorted(x["id"] for x in r.json()["data"]):
                  print("  ", m)
          m = os.environ["MODEL"]
          # Same request shape the app uses (predictor/mirofish_client.py):
          # a report that must end with a BETTING PREDICTIONS JSON block.
          import sys
          sys.path.insert(0, ".")
          from predictor.mirofish_client import build_request_payload, _SYSTEM_PROMPT
          user = ("Home team: strong attack (2.1 xG/game), away team: weak defence (1.8 xGA/game). "
                  "Write a short analytical report and end with a 'BETTING PREDICTIONS' section containing a JSON "
                  "block with keys home_win_pct, draw_pct, away_win_pct, over_2_5_pct, btts_yes_pct, most_likely_scoreline.")
          payload = build_request_payload(m, [{"role": "system", "content": _SYSTEM_PROMPT},
                                              {"role": "user", "content": user}])
          r = requests.post("https://api.groq.com/openai/v1/chat/completions", headers=h, timeout=120, json=payload)
          print(f"completion with {m}: {r.status_code}")
          if r.ok:
              msg = r.json()["choices"][0]["message"]
              content = msg.get("content") or ""
              print("content chars:", len(content), "| has JSON block:", "BETTING PREDICTIONS" in content and "{" in content)
              print("usage:", r.json().get("usage"))
              print(content[-600:])
          else:
              print(r.text[:300])

          if os.environ.get("SWARM", "true") == "true":
              import time, logging
              logging.basicConfig(level=logging.INFO, format="%(message)s")
              os.environ["LLM_API_KEY"] = os.environ["GROQ_API_KEY"]
              os.environ["LLM_MODEL_NAME"] = m
              import importlib, predictor.mirofish_client as mc
              importlib.reload(mc)
              seed = open("tests/fixtures/sample_seed.md", encoding="utf-8").read()
              prompt = ("Simulate expert football analysts and fans debating the outcome of Genoa CFC vs ACF Fiorentina "
                        "(Serie A, 10 October 2026). Use all statistical evidence to build consensus predictions. In the final "
                        "report, include a clearly labelled 'BETTING PREDICTIONS' section with probability percentages for: match "
                        "result (1X2), Over/Under 2.5 goals, Over/Under 3.5 goals, Both Teams To Score, Over/Under 9.5 corners, "
                        "Over/Under 3.5 yellow cards, red card probability, and the most likely scoreline. Format the predictions "
                        "as a JSON block inside the report.")
              t = time.time()
              res = mc.MiroFishClient().run_match_prediction(seed, prompt, "Genoa CFC vs ACF Fiorentina — Serie A 10/10/2026")
              print(f"\n=== SWARM RESULT: status={res['status']} mode={res.get('mode')} panel={len(res.get('panel', []))} in {time.time()-t:.1f}s")
              for th in res.get("panel", []):
                  print(f"  {th['label']:36s} {th['verdict']}  {th['home_win_pct']}/{th['draw_pct']}/{th['away_win_pct']}  {th['scoreline']}  {th['argument'][:90]}")
              from predictor.result_parser import ResultParser
              p = ResultParser().parse(res.get("report_markdown", ""))
              print(f"parsed: source={p.parse_source} 1X2={p.home_win_pct}/{p.draw_pct}/{p.away_win_pct} over2.5={p.over_2_5_pct} scoreline={p.most_likely_scoreline}")
              print("--- report tail ---")
              print(res.get("report_markdown", res.get("error", ""))[-900:])
          EOF
