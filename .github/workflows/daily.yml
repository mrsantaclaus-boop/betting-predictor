name: Daily agent

on:
  schedule:
    - cron: "0 7 * * *"    # 09:00 Rome (08:00 in winter): sync + predict + picks
    - cron: "0 17 * * *"   # late price for tonight's value bets (closing-line value)
    - cron: "0 22 * * *"   # evening: sync results of today's matches
  workflow_dispatch:
    inputs:
      mode:
        description: "full (sync + predict + picks), sync, or closing (late odds for CLV)"
        default: full
        type: choice
        options: [full, sync, closing]

concurrency:
  group: daily-agent
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install requests
      - name: Run agent
        env:
          SAI_BASE_URL: ${{ secrets.SAI_BASE_URL }}
          SAI_ADMIN_TOKEN: ${{ secrets.SAI_ADMIN_TOKEN }}
        run: |
          MODE="${{ github.event.inputs.mode }}"
          if [ -z "$MODE" ]; then
            case "${{ github.event.schedule }}" in
              "0 22 * * *") MODE=sync ;;
              "0 17 * * *") MODE=closing ;;
              *) MODE=full ;;
            esac
          fi
          python scripts/daily_agent.py "$MODE"
